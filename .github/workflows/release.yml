# Builds the universal macOS .dmg on a macOS runner and publishes it as a GitHub Release.
# Push a tag like v1.0.0 to cut a release (or run it by hand from the Actions tab with a tag name).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (created on the selected commit if it does not exist)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Ad-hoc signing only (no Developer ID on CI); see the README for "Open Anyway".
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the universal .dmg (typecheck, production build, package)
        run: npm run build

      - name: Check the app is universal
        run: |
          lipo -info "release/mac-universal/Vector Front.app/Contents/MacOS/Vector Front"
          ls -la release/*.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.dmg --clobber
          else
            gh release create "$TAG" release/*.dmg --target "$GITHUB_SHA" --title "Vector Front ${TAG#v}" --notes-file .github/release-notes.md
          fi
